<!doctype html>
<html lang="hi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#120a0e">
  <title>Siya ke liye</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="scene" aria-label="Ek chhota sa 3D room"></canvas>

  <!-- Entrance -->
  <div id="intro">
    <div class="intro-inner">
      <p class="kicker">Siya ke liye</p>
      <h1>Lapodi, ye jagah sirf tumhare liye hai.</h1>
      <p id="soundnote" class="soft" hidden></p>
      <button id="enter" class="btn primary" disabled>tayyar ho raha hai…</button>
    </div>
  </div>

  <!-- Story panel -->
  <div id="hud" hidden>
    <section id="panel" aria-live="polite">
      <p id="eyebrow" class="eyebrow"></p>
      <h2 id="title"></h2>
      <div id="body"></div>
      <div id="actions">
        <button id="back" class="btn ghost" hidden>Peeche</button>
        <button id="next" class="btn primary">Aage</button>
      </div>
    </section>
    <nav id="dots" aria-label="Room ke hisse"></nav>
    <button id="mute" class="icon-btn" aria-label="Music on/off" hidden>♪</button>
    <p id="hint" class="hint"></p>
  </div>

  <div id="lightbox" hidden><img alt=""><button aria-label="Band karo">×</button></div>
  <div id="hearts" aria-hidden="true"></div>
  <div id="yt" aria-hidden="true"></div>

  <!-- Shown only if the browser can't do 3D -->
  <main id="fallback" hidden></main>

  <script src="lib/gsap.min.js"></script>
  <script type="module" src="main.js"></script>
</body>
</html>
